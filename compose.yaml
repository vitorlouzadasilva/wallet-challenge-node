name: wallet-node

services:
  app:
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3010}:3000"
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}@mysql:3306/${MYSQL_DATABASE}"
      TEST_DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}@mysql:3306/wallet_node_test"
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:3010}"
      TRUSTED_PROXY_IP_HEADER: "${TRUSTED_PROXY_IP_HEADER:-}"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wallet-node-network

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3311}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wallet-node-network

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    ports:
      - "127.0.0.1:8091:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wallet-node-network

networks:
  wallet-node-network:

volumes:
  mysql-data:
  node-modules:
